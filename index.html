<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Luta Moçambicana</title>
<style>
  html,body{margin:0;height:100%;background:#0b0b10;overflow:hidden}
  #stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:min(100vw,calc(100vh*16/9));aspect-ratio:16/9;background:#000}
  #stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  #hud{pointer-events:none}
  #loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;
    font:600 22px/1.4 system-ui,sans-serif;letter-spacing:.04em;background:#0b0b10}
</style>
<script type="importmap">
{ "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }
</script>
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>
  <canvas id="hud"></canvas>
  <div id="loading">Carregando…</div>
</div>
<script type="module" src="./dist/main.js"></script>
</body>
</html>
